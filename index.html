<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>スマブラ戦績管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0f1014;
  --card:#1a1c22;
  --border:#2d313a;
  --text:#f3f3f3;
  --muted:#8e96a3;
  --accent:#ff5f57;
  --win:#39d98a;
  --lose:#ff5f57;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
  "Hiragino Sans",
  "Noto Sans JP",
  sans-serif;
}

button,input,select{
  font:inherit;
}

#login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:1rem;
}

.login-card{
  width:100%;
  max-width:340px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2rem;
  text-align:center;
}

.login-btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:1rem;
  cursor:pointer;
  font-weight:bold;
  margin-top:1rem;
}

#app{
  display:none;
  max-width:1200px;
  margin:auto;
  padding:1rem;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1rem;
  flex-wrap:wrap;
  gap:1rem;
}

.logout-btn{
  border:none;
  border-radius:12px;
  padding:.8rem 1rem;
  cursor:pointer;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:1rem;
  margin-bottom:1rem;
}

.section-title{
  margin-bottom:1rem;
  font-size:1rem;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.8rem;
}

.stat{
  background:#12141a;
  border-radius:16px;
  padding:1rem;
  text-align:center;
}

.stat-label{
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:.4rem;
}

.stat-value{
  font-size:1.5rem;
  font-weight:bold;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:.8rem;
}

.full{
  grid-column:1/-1;
}

.input{
  width:100%;
  background:#101217;
  border:1px solid var(--border);
  color:white;
  padding:.9rem;
  border-radius:14px;
}

.char-row{
  display:flex;
  gap:.5rem;
}

.add-btn{
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  padding:0 1rem;
  cursor:pointer;
}

.result-buttons{
  display:flex;
  gap:.8rem;
  margin-top:1rem;
}

.result-btn{
  flex:1;
  border:none;
  border-radius:16px;
  padding:1rem;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
  min-height:60px;
}

.win-btn{
  background:var(--win);
  color:black;
}

.lose-btn{
  background:var(--lose);
  color:white;
}

.quick-rematch{
  width:100%;
  border:none;
  border-radius:14px;
  background:#2a2d36;
  color:white;
  padding:1rem;
  margin-top:.8rem;
  cursor:pointer;
}

.chart-wrap{
  height:250px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:.8rem .5rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:left;
}

.badge{
  padding:.2rem .7rem;
  border-radius:999px;
  font-size:.8rem;
  font-weight:bold;
}

.badge-win{
  background:rgba(57,217,138,.2);
  color:var(--win);
}

.badge-lose{
  background:rgba(255,95,87,.2);
  color:var(--lose);
}

.history-day{
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:1rem 0;
}

.record-row{
  display:flex;
  justify-content:space-between;
  gap:1rem;
  padding:.7rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}

.flex-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
}

.scroll{
  overflow-x:auto;
}

.delete-btn{
  background:#ff5f57;
  border:none;
  color:white;
  border-radius:10px;
  padding:.45rem .7rem;
  cursor:pointer;
  font-size:.8rem;
}

@media(max-width:900px){

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .flex-grid{
    grid-template-columns:1fr;
  }

  .stat-value{
    font-size:1.3rem;
  }

  body{
    font-size:16px;
  }

}

</style>
</head>
<body>

<div id="login">

  <div class="login-card">

    <h1>🎮 スマブラ戦績管理</h1>

    <button class="login-btn" id="login-btn">
      Googleでログイン
    </button>

  </div>

</div>

<div id="app">

<header>

  <div>
    <h1>🎮 スマブラ戦績</h1>
    <div id="user-name"></div>
  </div>

  <button class="logout-btn" id="logout-btn">
    ログアウト
  </button>

</header>

<div class="stats-grid">

  <div class="stat">
    <div class="stat-label">総試合数</div>
    <div class="stat-value" id="total-games">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">総合勝率</div>
    <div class="stat-value" id="overall-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">最近50戦</div>
    <div class="stat-value" id="recent-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">今日の勝率</div>
    <div class="stat-value" id="today-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">現在連勝</div>
    <div class="stat-value" id="current-win">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">現在連敗</div>
    <div class="stat-value" id="current-lose">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">最大連勝</div>
    <div class="stat-value" id="max-win">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">最大連敗</div>
    <div class="stat-value" id="max-lose">0</div>
  </div>

</div>

<div class="card">

  <h2 class="section-title">高速記録</h2>

  <div class="form-grid">

    <div>
      <label>日付</label>
      <input type="date" class="input" id="date">
    </div>

    <div>

      <label>自キャラ</label>

      <div class="char-row">

        <select class="input" id="my-char"></select>

        <button class="add-btn" id="add-char">
          ＋
        </button>

      </div>

    </div>

    <div>

      <label>相手キャラ</label>

      <select class="input" id="enemy-char"></select>

    </div>

    <div class="full">

      <label>メモ</label>

      <input
      type="text"
      class="input"
      id="memo"
      placeholder="崖弱い、空後通った など">

    </div>

  </div>

  <div class="result-buttons">

    <button class="result-btn win-btn" id="win-btn">
      勝ち
    </button>

    <button class="result-btn lose-btn" id="lose-btn">
      負け
    </button>

  </div>

  <button class="quick-rematch" id="rematch-btn">
    🔁 同条件で再戦記録
  </button>

</div>

<div class="card">

  <h2 class="section-title">勝率推移</h2>

  <div class="chart-wrap">
    <canvas id="main-chart"></canvas>
  </div>

</div>

<div class="card">

  <h2 class="section-title">日別勝率</h2>

  <div class="chart-wrap">
    <canvas id="daily-chart"></canvas>
  </div>

</div>

<div class="flex-grid">

  <div class="card scroll">

    <h2 class="section-title">キャラ別勝率</h2>

    <table class="table">

      <thead>
        <tr>
          <th>キャラ</th>
          <th>勝率</th>
          <th>使用数</th>
        </tr>
      </thead>

      <tbody id="char-stats"></tbody>

    </table>

  </div>

  <div class="card scroll">

    <h2 class="section-title">相手別勝率</h2>

    <table class="table">

      <thead>
        <tr>
          <th>相手</th>
          <th>勝率</th>
          <th>対戦数</th>
        </tr>
      </thead>

      <tbody id="enemy-stats"></tbody>

    </table>

  </div>

</div>

<div class="card">

  <h2 class="section-title">月別統計</h2>

  <div id="monthly-stats"></div>

</div>

<div class="card">

  <h2 class="section-title">履歴</h2>

  <div id="history"></div>

</div>

</div>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  initializeAuth,
  browserLocalPersistence,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  set,
  remove,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyDRPoPzYLgEQfRo78-9sp8pRtqvwX_HSyw",
  authDomain:"smash-5a24b.firebaseapp.com",
  databaseURL:"https://smash-5a24b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"smash-5a24b",
  storageBucket:"smash-5a24b.firebasestorage.app",
  messagingSenderId:"113588232501",
  appId:"1:113588232501:web:a36b32f7f3f6b67b06ac7c"
};

const app = initializeApp(firebaseConfig);

const auth = initializeAuth(app,{
  persistence: browserLocalPersistence
});

const db = getDatabase(app);

const provider = new GoogleAuthProvider();

let currentUser = null;
let records = [];
let characters = [];

let mainChart = null;
let dailyChart = null;

const login = document.getElementById("login");
const appEl = document.getElementById("app");

const dateEl = document.getElementById("date");
const myCharEl = document.getElementById("my-char");
const enemyCharEl = document.getElementById("enemy-char");
const memoEl = document.getElementById("memo");

dateEl.value =
new Date().toISOString().slice(0,10);

document.getElementById("login-btn")
.onclick = async()=>{

  try{

    await signInWithPopup(auth,provider);

  }catch(err){

    console.error(err);

    alert(
      "ログイン失敗\n\n" +
      err.message
    );

  }

};

document.getElementById("logout-btn")
.onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{

  currentUser = user;

  if(user){

    login.style.display = "none";
    appEl.style.display = "block";

    document.getElementById("user-name")
    .textContent = user.displayName;

    loadSettings();
    loadRecords();

  }else{

    login.style.display = "flex";
    appEl.style.display = "none";

  }

});

async function addCharacter(){

  const name = prompt("キャラ名");

  if(!name)return;

  if(characters.includes(name)){

    alert("既に存在します");

    return;

  }

  characters.push(name);

  characters.sort();

  await set(
    ref(
      db,
      `users/${currentUser.uid}/settings/characters`
    ),
    characters
  );

}

document.getElementById("add-char")
.onclick = ()=>addCharacter();

function renderCharacterLists(){

  myCharEl.innerHTML = "";

  enemyCharEl.innerHTML =
  `<option value="">選択</option>`;

  characters.forEach(c=>{

    const op1 =
    document.createElement("option");

    op1.value = c;
    op1.textContent = c;

    myCharEl.appendChild(op1);

    const op2 =
    document.createElement("option");

    op2.value = c;
    op2.textContent = c;

    enemyCharEl.appendChild(op2);

  });

}

function loadSettings(){

  onValue(
    ref(
      db,
      `users/${currentUser.uid}/settings`
    ),

    snap=>{

      const data = snap.val() || {};

      characters =
      data.characters ||
      [
        "マリオ",
        "クラウド",
        "ピカチュウ",
        "スティーブ"
      ];

      renderCharacterLists();

      if(data.lastMyChar){

        myCharEl.value =
        data.lastMyChar;

      }

    }
  );

}

async function addRecord(result){

  const payload = {

    date:
    dateEl.value,

    myChar:
    myCharEl.value,

    enemyChar:
    enemyCharEl.value,

    memo:
    memoEl.value.trim(),

    result,

    createdAt:
    serverTimestamp()

  };

  await push(
    ref(
      db,
      `users/${currentUser.uid}/records`
    ),
    payload
  );

  await set(
    ref(
      db,
      `users/${currentUser.uid}/settings/lastMyChar`
    ),
    myCharEl.value
  );

  enemyCharEl.value = "";
  memoEl.value = "";

}

document.getElementById("win-btn")
.onclick = ()=>addRecord("win");

document.getElementById("lose-btn")
.onclick = ()=>addRecord("lose");

document.getElementById("rematch-btn")
.onclick = async()=>{

  if(!records.length)return;

  const last =
  [...records]
  .sort((a,b)=>
    b.createdAt-a.createdAt
  )[0];

  await addRecord(last.result);

};

function loadRecords(){

  onValue(
    ref(
      db,
      `users/${currentUser.uid}/records`
    ),

    snap=>{

      records = [];

      snap.forEach(child=>{

        records.push({
          id:child.key,
          ...child.val()
        });

      });

      records.sort((a,b)=>
        a.createdAt-b.createdAt
      );

      renderAll();

    }
  );

}

function renderAll(){

  renderStats();
  renderMainChart();
  renderDailyChart();
  renderCharacterStats();
  renderEnemyStats();
  renderMonthly();
  renderHistory();

}

function renderStats(){

  const total = records.length;

  const wins =
  records.filter(r=>
  r.result==="win").length;

  const rate =
  total ?
  Math.round(wins/total*100)
  :0;

  document.getElementById("total-games")
  .textContent = total;

  document.getElementById("overall-rate")
  .textContent = rate+"%";

  const recent =
  records.slice(-50);

  const recentWins =
  recent.filter(r=>
  r.result==="win").length;

  const recentRate =
  recent.length ?
  Math.round(recentWins/recent.length*100)
  :0;

  document.getElementById("recent-rate")
  .textContent = recentRate+"%";

  const today =
  new Date().toISOString().slice(0,10);

  const todayRecords =
  records.filter(r=>
  r.date===today);

  const todayWins =
  todayRecords.filter(r=>
  r.result==="win").length;

  const todayRate =
  todayRecords.length ?
  Math.round(
  todayWins/todayRecords.length*100)
  :0;

  document.getElementById("today-rate")
  .textContent = todayRate+"%";

  calculateStreaks();

}

function calculateStreaks(){

  let currentWin = 0;
  let currentLose = 0;

  let maxWin = 0;
  let maxLose = 0;

  let tempWin = 0;
  let tempLose = 0;

  const reversed =
  [...records].reverse();

  for(const r of reversed){

    if(r.result==="win"){
      currentWin++;
    }else{
      break;
    }

  }

  for(const r of reversed){

    if(r.result==="lose"){
      currentLose++;
    }else{
      break;
    }

  }

  records.forEach(r=>{

    if(r.result==="win"){

      tempWin++;
      tempLose = 0;

    }else{

      tempLose++;
      tempWin = 0;

    }

    if(tempWin > maxWin)
    maxWin = tempWin;

    if(tempLose > maxLose)
    maxLose = tempLose;

  });

  document.getElementById("current-win")
  .textContent = currentWin;

  document.getElementById("current-lose")
  .textContent = currentLose;

  document.getElementById("max-win")
  .textContent = maxWin;

  document.getElementById("max-lose")
  .textContent = maxLose;

}

function renderMainChart(){

  const ctx =
  document.getElementById("main-chart");

  if(mainChart)mainChart.destroy();

  let wins = 0;

  const labels = [];
  const data = [];

  records.forEach((r,i)=>{

    if(r.result==="win")wins++;

    labels.push(i+1);

    data.push(
    Math.round(
    wins/(i+1)*100));

  });

  mainChart =
  new Chart(ctx,{

    type:"line",

    data:{

      labels,

      datasets:[{

        data,

        borderColor:"#ff5f57",

        backgroundColor:
        "rgba(255,95,87,.1)",

        fill:true,

        tension:.3

      }]

    },

    options:{

      responsive:true,
      maintainAspectRatio:false,

      plugins:{
        legend:{
          display:false
        }
      },

      scales:{
        y:{
          min:0,
          max:100
        }
      }

    }

  });

}

function renderDailyChart(){

  const ctx =
  document.getElementById("daily-chart");

  if(dailyChart)dailyChart.destroy();

  const grouped = {};

  records.forEach(r=>{

    if(!grouped[r.date]){

      grouped[r.date] = {
        total:0,
        wins:0
      };

    }

    grouped[r.date].total++;

    if(r.result==="win")
    grouped[r.date].wins++;

  });

  const labels =
  Object.keys(grouped).sort();

  const data =
  labels.map(d=>

    Math.round(
    grouped[d].wins/
    grouped[d].total*100)

  );

  dailyChart =
  new Chart(ctx,{

    type:"bar",

    data:{

      labels,

      datasets:[{

        data,

        backgroundColor:
        "#39d98a"

      }]

    },

    options:{

      responsive:true,
      maintainAspectRatio:false,

      plugins:{
        legend:{
          display:false
        }
      },

      scales:{
        y:{
          min:0,
          max:100
        }
      }

    }

  });

}

function renderCharacterStats(){

  const tbody =
  document.getElementById("char-stats");

  tbody.innerHTML = "";

  const stats = {};

  records.forEach(r=>{

    if(!stats[r.myChar]){

      stats[r.myChar] = {
        total:0,
        wins:0
      };

    }

    stats[r.myChar].total++;

    if(r.result==="win")
    stats[r.myChar].wins++;

  });

  Object.entries(stats)
  .sort((a,b)=>
  b[1].total-a[1].total)

  .forEach(([char,s])=>{

    const tr =
    document.createElement("tr");

    tr.innerHTML = `
      <td>${char}</td>
      <td>
      ${Math.round(
      s.wins/s.total*100)}%
      </td>
      <td>${s.total}</td>
    `;

    tbody.appendChild(tr);

  });

}

function renderEnemyStats(){

  const tbody =
  document.getElementById("enemy-stats");

  tbody.innerHTML = "";

  const stats = {};

  records.forEach(r=>{

    if(!r.enemyChar)return;

    if(!stats[r.enemyChar]){

      stats[r.enemyChar] = {
        total:0,
        wins:0
      };

    }

    stats[r.enemyChar].total++;

    if(r.result==="win")
    stats[r.enemyChar].wins++;

  });

  Object.entries(stats)
  .sort((a,b)=>
  b[1].total-a[1].total)

  .forEach(([char,s])=>{

    const tr =
    document.createElement("tr");

    tr.innerHTML = `
      <td>${char}</td>
      <td>
      ${Math.round(
      s.wins/s.total*100)}%
      </td>
      <td>${s.total}</td>
    `;

    tbody.appendChild(tr);

  });

}

function renderMonthly(){

  const el =
  document.getElementById("monthly-stats");

  el.innerHTML = "";

  const grouped = {};

  records.forEach(r=>{

    const month =
    r.date.slice(0,7);

    if(!grouped[month]){

      grouped[month] = {
        total:0,
        wins:0
      };

    }

    grouped[month].total++;

    if(r.result==="win")
    grouped[month].wins++;

  });

  Object.entries(grouped)
  .sort((a,b)=>b[0].localeCompare(a[0]))

  .forEach(([month,s])=>{

    const div =
    document.createElement("div");

    div.style.padding = ".7rem 0";

    div.innerHTML = `
      ${month}
      :
      ${s.total}戦
      /
      勝率
      ${Math.round(
      s.wins/s.total*100)}%
    `;

    el.appendChild(div);

  });

}

function renderHistory(){

  const history =
  document.getElementById("history");

  history.innerHTML = "";

  const grouped = {};

  records.forEach(r=>{

    if(!grouped[r.date]){

      grouped[r.date] = [];

    }

    grouped[r.date].push(r);

  });

  Object.keys(grouped)
  .sort((a,b)=>b.localeCompare(a))

  .forEach(date=>{

    const wrap =
    document.createElement("div");

    wrap.className = "history-day";

    const dayRecords =
    grouped[date];

    const wins =
    dayRecords.filter(r=>
    r.result==="win").length;

    wrap.innerHTML = `
      <h3>
      ${date}
      (${wins}勝
      ${dayRecords.length-wins}敗)
      </h3>
    `;

    dayRecords.reverse()
    .forEach(r=>{

      const row =
      document.createElement("div");

      row.className = "record-row";

      row.innerHTML = `

        <div>

          <div>
            ${r.myChar}
            vs
            ${r.enemyChar || "?"}
          </div>

          <div
          style="
          color:#8e96a3;
          font-size:.85rem">

            ${r.memo || ""}

          </div>

        </div>

        <div
        style="
        display:flex;
        align-items:center;
        gap:.6rem;">

          <div class="
          badge
          badge-${r.result}">

            ${r.result==="win"
            ? "勝"
            : "負"}

          </div>

          <button
          class="delete-btn"
          data-id="${r.id}">

            削除

          </button>

        </div>

      `;

      wrap.appendChild(row);

    });

    history.appendChild(wrap);

  });

  document
  .querySelectorAll(".delete-btn")
  .forEach(btn=>{

    btn.onclick = async()=>{

      const ok =
      confirm("この記録を削除しますか？");

      if(!ok)return;

      await remove(
        ref(
          db,
          `users/${currentUser.uid}/records/${btn.dataset.id}`
        )
      );

    };

  });

}

</script>

</body>
</html>
