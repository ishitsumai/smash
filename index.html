<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>スマブラ戦績管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0f1014;
  --card:#1a1c22;
  --border:#2d313a;
  --text:#f3f3f3;
  --muted:#8e96a3;
  --accent:#ff5f57;
  --win:#39d98a;
  --lose:#ff5f57;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
  "Hiragino Sans",
  "Noto Sans JP",
  sans-serif;
}

button,input,select{
  font:inherit;
}

#login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:1rem;
}

.login-card{
  width:100%;
  max-width:340px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2rem;
  text-align:center;
}

.login-btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:1rem;
  cursor:pointer;
  font-weight:bold;
  margin-top:1rem;
}

#app{
  display:none;
  max-width:1200px;
  margin:auto;
  padding:1rem;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1rem;
  flex-wrap:wrap;
  gap:1rem;
}

.logout-btn{
  border:none;
  border-radius:12px;
  padding:.8rem 1rem;
  cursor:pointer;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:1rem;
  margin-bottom:1rem;
}

.section-title{
  margin-bottom:1rem;
  font-size:1rem;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.8rem;
}

.stat{
  background:#12141a;
  border-radius:16px;
  padding:1rem;
  text-align:center;
}

.stat-label{
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:.4rem;
}

.stat-value{
  font-size:1.5rem;
  font-weight:bold;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:.8rem;
}

.full{
  grid-column:1/-1;
}

.input{
  width:100%;
  background:#101217;
  border:1px solid var(--border);
  color:white;
  padding:.9rem;
  border-radius:14px;
}

.char-row{
  display:flex;
  gap:.5rem;
}

.add-btn{
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  padding:0 1rem;
  cursor:pointer;
}

.result-buttons{
  display:flex;
  gap:.8rem;
  margin-top:1rem;
}

.result-btn{
  flex:1;
  border:none;
  border-radius:16px;
  padding:1rem;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
  min-height:60px;
}

.win-btn{
  background:var(--win);
  color:black;
}

.lose-btn{
  background:var(--lose);
  color:white;
}

.quick-rematch{
  width:100%;
  border:none;
  border-radius:14px;
  background:#2a2d36;
  color:white;
  padding:1rem;
  margin-top:.8rem;
  cursor:pointer;
}

.chart-wrap{
  height:250px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:.8rem .5rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:left;
}

.badge{
  padding:.2rem .7rem;
  border-radius:999px;
  font-size:.8rem;
  font-weight:bold;
}

.badge-win{
  background:rgba(57,217,138,.2);
  color:var(--win);
}

.badge-lose{
  background:rgba(255,95,87,.2);
  color:var(--lose);
}

.history-day{
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:1rem 0;
}

.record-row{
  display:flex;
  justify-content:space-between;
  gap:1rem;
  padding:.7rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}

.flex-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
}

.scroll{
  overflow-x:auto;
}

.delete-btn{
  background:#ff5f57;
  border:none;
  color:white;
  border-radius:10px;
  padding:.45rem .7rem;
  cursor:pointer;
  font-size:.8rem;
}

@media(max-width:900px){

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .flex-grid{
    grid-template-columns:1fr;
  }

  .stat-value{
    font-size:1.3rem;
  }

  body{
    font-size:16px;
  }

}

</style>
</head>
<body>

<div id="login">

  <div class="login-card">

    <h1>🎮 スマブラ戦績管理</h1>

    <button class="login-btn" id="login-btn">
      Googleでログイン
    </button>

  </div>

</div>

<div id="app">

<header>

  <div>
    <h1>🎮 スマブラ戦績</h1>
    <div id="user-name"></div>
  </div>

  <button class="logout-btn" id="logout-btn">
    ログアウト
  </button>

</header>

<div class="stats-grid">

  <div class="stat">
    <div class="stat-label">総試合数</div>
    <div class="stat-value" id="total-games">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">総合勝率</div>
    <div class="stat-value" id="overall-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">最近50戦</div>
    <div class="stat-value" id="recent-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">今日の勝率</div>
    <div class="stat-value" id="today-rate">0%</div>
  </div>

  <div class="stat">
    <div class="stat-label">現在連勝</div>
    <div class="stat-value" id="current-win">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">現在連敗</div>
    <div class="stat-value" id="current-lose">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">最大連勝</div>
    <div class="stat-value" id="max-win">0</div>
  </div>

  <div class="stat">
    <div class="stat-label">最大連敗</div>
    <div class="stat-value" id="max-lose">0</div>
  </div>

</div>

<div class="card">

  <h2 class="section-title">高速記録</h2>

  <div class="form-grid">

    <div>
      <label>日付</label>
      <input type="date" class="input" id="date">
    </div>

    <div>

      <label>自キャラ</label>

      <div class="char-row">

        <select class="input" id="my-char"></select>

        <button class="add-btn" id="add-char">
          ＋
        </button>

      </div>

    </div>

    <div>

      <label>相手キャラ</label>

      <select class="input" id="enemy-char"></select>

    </div>

    <div class="full">

      <label>メモ</label>

      <input
      type="text"
      class="input"
      id="memo"
      placeholder="崖弱い、空後通った など">

    </div>

  </div>

  <div class="result-buttons">

    <button class="result-btn win-btn" id="win-btn">
      勝ち
    </button>

    <button class="result-btn lose-btn" id="lose-btn">
      負け
    </button>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  initializeAuth,
  browserLocalPersistence,
  browserPopupRedirectResolver,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  set,
  remove,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyDRPoPzYLgEQfRo78-9sp8pRtqvwX_HSyw",
  authDomain:"smash-5a24b.firebaseapp.com",
  databaseURL:"https://smash-5a24b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"smash-5a24b",
  storageBucket:"smash-5a24b.firebasestorage.app",
  messagingSenderId:"113588232501",
  appId:"1:113588232501:web:a36b32f7f3f6b67b06ac7c"
};

const app = initializeApp(firebaseConfig);

const auth = initializeAuth(app,{
  persistence: browserLocalPersistence,
  popupRedirectResolver:
  browserPopupRedirectResolver
});

const db = getDatabase(app);

const provider =
new GoogleAuthProvider();

document
.getElementById("login-btn")
.onclick = async()=>{

  try{

    await signInWithPopup(
      auth,
      provider
    );

  }catch(err){

    console.error(err);

    alert(
      "ログイン失敗\n\n"+
      err.message
    );

  }

};

document
.getElementById("logout-btn")
.onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{

  if(user){

    document
    .getElementById("login")
    .style.display="none";

    document
    .getElementById("app")
    .style.display="block";

    document
    .getElementById("user-name")
    .textContent=
    user.displayName;

  }else{

    document
    .getElementById("login")
    .style.display="flex";

    document
    .getElementById("app")
    .style.display="none";

  }

});

</script>

</body>
</html>
