<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smash Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

header{
  padding:20px;
  background:#1e293b;
  position:sticky;
  top:0;
}

h1{
  margin:0;
  font-size:24px;
}

.container{
  padding:16px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#1e293b;
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:14px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  box-sizing:border-box;
}

button{
  border:none;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}

.win{
  background:#22c55e;
  color:white;
}

.lose{
  background:#ef4444;
  color:white;
}

.google{
  background:white;
  color:black;
}

.logout{
  background:#475569;
  color:white;
}

.stat{
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}

.history{
  border-bottom:1px solid #334155;
  padding:12px 0;
}

.memo{
  color:#94a3b8;
  font-size:14px;
  margin-top:6px;
}

canvas{
  background:white;
  border-radius:12px;
  padding:10px;
}

.flex{
  display:flex;
  gap:10px;
}

.flex button{
  flex:1;
}
</style>
</head>

<body>

<header>
  <h1>⚔️ Smash Tracker</h1>
</header>

<div class="container">

<div class="card" id="loginCard">
  <h2>Googleログイン</h2>

  <button class="google" onclick="login()">
    Googleでログイン
  </button>
</div>

<div id="app" style="display:none;">

<div class="card">

  <h2>試合記録</h2>

  <label>自キャラ</label>

  <select id="myChar">
    <option>クラウド</option>
    <option>ホムラ</option>
    <option>ジョーカー</option>
    <option>スティーブ</option>
    <option>勇者</option>
    <option>カズヤ</option>
  </select>

  <label>相手キャラ</label>

  <input id="enemyChar" placeholder="例: ソニック">

  <label>メモ</label>

  <textarea id="memo"></textarea>

  <div class="flex">

    <button class="win" onclick="saveMatch('win')">
      勝ち
    </button>

    <button class="lose" onclick="saveMatch('lose')">
      負け
    </button>

  </div>

</div>

<div class="card">

  <h2>総合戦績</h2>

  <div class="stat" id="totalStats">
    0勝0敗
  </div>

  <div class="stat" id="winRate">
    勝率 0%
  </div>

</div>

<div class="card">

  <h2>勝率推移グラフ</h2>

  <canvas id="chart"></canvas>

</div>

<div class="card">

  <h2>履歴</h2>

  <div id="history"></div>

</div>

<div class="card">

  <button class="logout" onclick="logout()">
    ログアウト
  </button>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRPoPzYLgEQfRo78-9sp8pRtqvwX_HSyw",
  authDomain: "smash-5a24b.firebaseapp.com",
  databaseURL: "https://smash-5a24b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smash-5a24b",
  storageBucket: "smash-5a24b.firebasestorage.app",
  messagingSenderId: "113588232501",
  appId: "1:113588232501:web:a36b32f7f3f6b67b06ac7c"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const provider = new GoogleAuthProvider();

let currentUser = null;

let allMatches = [];

let chart = null;

window.login = async function(){

  try{

    await signInWithRedirect(auth, provider);

  }catch(e){

    alert("ログインエラー: " + e.message);

  }

}

window.logout = async function(){

  await signOut(auth);

}

onAuthStateChanged(auth, (user)=>{

  if(user){

    currentUser = user;

    document.getElementById("loginCard").style.display = "none";

    document.getElementById("app").style.display = "block";

    loadMatches();

  }else{

    document.getElementById("loginCard").style.display = "block";

    document.getElementById("app").style.display = "none";

  }

});

window.saveMatch = async function(result){

  const myChar =
    document.getElementById("myChar").value;

  const enemyChar =
    document.getElementById("enemyChar").value;

  const memo =
    document.getElementById("memo").value;

  if(enemyChar.trim()===""){

    alert("相手キャラを入力");

    return;

  }

  const matchRef =
    ref(db, "matches/" + currentUser.uid);

  await push(matchRef, {

    myChar,
    enemyChar,
    memo,
    result,
    timestamp: Date.now()

  });

  document.getElementById("memo").value = "";

}

function loadMatches(){

  const matchRef =
    ref(db, "matches/" + currentUser.uid);

  onValue(matchRef, (snapshot)=>{

    const data = snapshot.val();

    allMatches = [];

    if(data){

      Object.values(data).forEach(v=>{

        allMatches.push(v);

      });

    }

    allMatches.sort((a,b)=>
      a.timestamp - b.timestamp
    );

    render();

  });

}

function render(){

  renderStats();

  renderHistory();

  renderChart();

}

function renderStats(){

  let wins = 0;

  let loses = 0;

  allMatches.forEach(m=>{

    if(m.result==="win") wins++;
    else loses++;

  });

  const rate =
    wins + loses === 0
    ? 0
    : ((wins/(wins+loses))*100).toFixed(1);

  document.getElementById("totalStats").innerText =
    `${wins}勝 ${loses}敗`;

  document.getElementById("winRate").innerText =
    `勝率 ${rate}%`;

}

function renderHistory(){

  const history =
    document.getElementById("history");

  history.innerHTML = "";

  [...allMatches].reverse().forEach(m=>{

    const div = document.createElement("div");

    div.className = "history";

    const date = new Date(m.timestamp);

    div.innerHTML = `
      <div>
        ${m.myChar}
        vs
        ${m.enemyChar}
      </div>

      <div>
        ${m.result==="win" ? "勝ち" : "負け"}
      </div>

      <div>
        ${date.toLocaleString()}
      </div>

      <div class="memo">
        ${m.memo || ""}
      </div>
    `;

    history.appendChild(div);

  });

}

function renderChart(){

  const cumulative = [];

  let wins = 0;

  allMatches.forEach((m,i)=>{

    if(m.result==="win") wins++;

    const rate =
      (wins/(i+1))*100;

    cumulative.push(rate);

  });

  const labels =
    allMatches.map((_,i)=>i+1);

  const ctx =
    document.getElementById("chart");

  if(chart){

    chart.destroy();

  }

  chart = new Chart(ctx, {

    type:"line",

    data:{
      labels:labels,

      datasets:[{
        label:"勝率推移",
        data:cumulative
      }]
    },

    options:{
      responsive:true,
      scales:{
        y:{
          min:0,
          max:100
        }
      }
    }

  });

}

</script>

</body>
</html>
